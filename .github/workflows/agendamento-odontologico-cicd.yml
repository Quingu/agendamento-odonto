name: Agendamento Odontologico CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

# O GITHUB_TOKEN só precisa ler o repositório.
permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          # Caminho relativo à raiz do repositório.
          cache-dependency-path: pom.xml

      - name: Permitir execucao do Maven Wrapper
        run: chmod +x mvnw

      - name: Executar testes e gerar o pacote
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: ./mvnw --batch-mode clean verify

      - name: Validar a imagem Docker
        run: docker build -t agendamento-odontologico:${{ github.sha }} .

  # Só roda quando a variable DEPLOY_ENABLED = true e o push é na main.
  # Enquanto a variable não existir, este job fica ignorado.
  deploy:
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Disparar deploy no Render
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
