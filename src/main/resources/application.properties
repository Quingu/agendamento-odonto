spring.application.name=agendamento-odontologico

# Credenciais vindas do ambiente (local, GitHub Actions e Render).
# Nenhum valor sensível deve ser gravado neste arquivo.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true

api.security.token.secret=${JWT_SECRET}

spring.web.error.include-stacktrace=never

# Necessário para aceitar conexões de fora do contêiner (Render/Docker).
server.address=0.0.0.0
# O Render injeta PORT; localmente o padrão é 8080.
server.port=${PORT:8080}

# Actuator: health check usado pelo Render.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
